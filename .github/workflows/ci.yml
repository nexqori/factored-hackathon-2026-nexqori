name: Nexqori checks
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python -m pip install -r backend/requirements.lock
      - run: python -m pytest backend/tests -q

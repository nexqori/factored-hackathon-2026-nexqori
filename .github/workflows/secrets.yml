name: Secret scan
on:
  push:
    branches: [main, develop]
  pull_request:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned scanner
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl --fail --silent --show-error --location --output gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output checksums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          expected=$(awk -v name="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" '$2 == name {print $1}' checksums.txt)
          test -n "$expected"
          printf '%s  gitleaks.tar.gz\n' "$expected" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan committed history
        run: ./gitleaks git . --redact --no-banner --log-opts="--all"
